name: RDX-GENIA
# version: '3.8'
services:

  backend_api:
    container_name: backend_api
    build:
      context: .
      dockerfile: apps/backend/dockerfile
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres


  langflow:
    container_name: langflow
    # image: langflowai/langflow:latest 
    build:
      context: .
      dockerfile: ./langflow/dockerfile
    user: root
    restart: always
    depends_on:
      - postgres
    ports:
      - "7860:7860"
      - "8931:8931"
    environment:
      PGVECTOR_CONNECTION_STRING: postgresql://postgres:postgres@postgres:5432/ia_team
      LANGFLOW_CONFIG_DIR: /app/langflow
      LANGFLOW_SAVE_DB_IN_CONFIG_DIR: "true"
      LANGFLOW_LANGCHAIN_CACHE: SQLiteCache
      LANGFLOW_LOG_LEVEL: debug
      LANGFLOW_COMPONENTS_PATH: /app/langflow/custom_components
      # DISPLAY: ${DISPLAY}
      DO_NOT_TRACK: "true"

    volumes:
      - langflow-data:/app/langflow
      - /tmp/.X11-unix:/tmp/.X11-unix

  postgres:
    image: ankane/pgvector:latest
    container_name: pgvector_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ia_team
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_NUM_PARTITIONS=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kraft-data:/bitnami/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"

  kafka_consumer:
    container_name: kafka_consumer
    build:
      context: ./services/kafka_consumer
      dockerfile: dockerfile
    env_file:
      - ./.env
    depends_on:
      - kafka
      - postgres
    ports:
      - "8001:8001"



volumes:
  langflow-data:
  pgdata:
  kraft-data: