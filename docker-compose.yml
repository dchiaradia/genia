name: RDX-GENIA
# version: '3.8'
services:

  backend_api:
    container_name: backend_api
    build:
      context: .
      dockerfile: apps/backend/dockerfile
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  uol_crawler:
    container_name: uol_crawler_sample
    build:
      context: .
      dockerfile: ./widgets/crawler_sample/dockerfile
    env_file:
      - ./.env
    depends_on:
      - postgres
    command: ["python", "crawler.py"]

  langflow:
    container_name: langflow
    # image: langflowai/langflow:latest 
    build:
      context: .
      dockerfile: ./langflow/dockerfile
    user: root
    restart: always
    depends_on:
      - postgres
    ports:
      - "7860:7860"
      - "8931:8931"
    environment:
      PGVECTOR_CONNECTION_STRING: postgresql://postgres:postgres@postgres:5432/ia_team
      LANGFLOW_CONFIG_DIR: /app/langflow
      LANGFLOW_SAVE_DB_IN_CONFIG_DIR: "true"
      LANGFLOW_LANGCHAIN_CACHE: SQLiteCache
      LANGFLOW_LOG_LEVEL: debug
      LANGFLOW_COMPONENTS_PATH: /app/langflow/custom_components
      # DISPLAY: ${DISPLAY}
      DO_NOT_TRACK: "true"

    volumes:
      - langflow-data:/app/langflow
      - /tmp/.X11-unix:/tmp/.X11-unix

  postgres:
    image: ankane/pgvector:latest
    container_name: pgvector_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ia_team
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  
  zookeeper:
    container_name: kafka-zookeeper
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:29092,PLAINTEXT_INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8080:8080"

  kafka_consumer:
    container_name: kafka_consumer
    build:
      context: ./services/kafka_consumer
      dockerfile: dockerfile
    env_file:
      - ./.env
    depends_on:
      - kafka
      - postgres
    ports:
      - "8001:8001"



volumes:
  langflow-data:
  pgdata: